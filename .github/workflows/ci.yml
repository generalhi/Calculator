name: CI

on:
  push:
    branches: [dev, main, master]
  pull_request:
    branches: [dev, main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Source/Calculator.sln

      - name: Build
        run: dotnet build Source/Calculator.sln -c Release --no-restore

      - name: Test
        run: dotnet test Source/Calculator.sln -c Release --no-build --logger "console;verbosity=normal"
